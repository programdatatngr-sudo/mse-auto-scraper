name: MSE Daily Auto Scraper

on:
  schedule:
    # GitHub UTC цаг ашигладаг!
    # Улаанбаатарын цаг (UTC+8) -> GitHub цаг (UTC = Улаанбаатар - 8 цаг)
    
    # Даваа-Баасан гарагуудад Улаанбаатарын 14:20 (UTC 06:20):
    - cron: '20 6 * * 1-5'
    
    # Даваа-Баасан гарагуудад Улаанбаатарын 15:10 (UTC 07:10):
    - cron: '10 7 * * 1-5'

  workflow_dispatch: # Гараар Run workflow хийж турших товч

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Код татах
        uses: actions/checkout@v4

      - name: Python орчин тохируулах
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Шаардлагатай сангуудыг суулгах
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Скрипт ажиллуулах
        run: python main.py
