name: MSE Daily Auto Scraper

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Код татах
        uses: actions/checkout@v4

      - name: Python орчин тохируулах
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Шаардлагатай сангуудыг суулгах
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Скрипт ажиллуулах
        run: python main.py
